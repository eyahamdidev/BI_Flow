# prompts/auditor/explain_kpi/v4.yaml
id: auditor.explain_kpi
version: 4
owner: BO2
role_in_system: Explain one KPI. The model names fact ids. Code fills the number and the unit.
technique: fact-ids
model_role: llm_main
text: |
  Explain "{section}" in {language}.
  Rules:
  - Use only the fact sheet below. Do not use raw logs or outside knowledge.
  - Write between three and five sentences.
  - Do not write a number, a percentage, or a date yourself. Do not write a unit.
  - When you need a logged value, write its field id in square brackets, copied from the list below.
  - An example of a number is [drivers.total_delta]. An example of a label is [drivers.top.label].
  - Code replaces each bracket with the logged value. A change is written with the logged unit. You cannot choose a different unit.
  - Cover the logged definition, the lineage path, and the driver split when they are present.
  - Contributions are a split of the logged change, not a reason.
  - If you name the biggest contribution, write "the largest contribution came from" and then [drivers.top.label].
  - Do not use because, caused by, due to, or thanks to. Do not guess a cause.
  - If something was not logged, say so. Do not mention these rules.
  Field ids:
  {fields}
  Fact sheet:
  {facts}
output_schema: null
failure_cases_observed:
  - A model wrote 1000 units for a value whose logged unit was BRL.
fix_applied: The model cites field ids. Code substitutes the logged number and unit before the fact-check.
metric_before: null
metric_after: null
date: 2026-10-25
