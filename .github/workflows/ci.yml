name: ci
on:
  pull_request:
  push: {branches: [main]}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check .

  contracts-and-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e contracts jsonschema pytest pyyaml
      - run: python scripts/export_schemas.py
      - name: schemas must be committed
        run: git diff --exit-code contracts/schemas
      - name: contract tests against all service mocks
        run: pytest tests/contract -q
      - name: prompt registry format check
        run: python scripts/check_prompt_registry.py

  service-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingest_quality, profile_clean, etl, semantic_kpi, analyst, auditor, gateway, dashboard]
    env: {FAKE_LLM: "1", BIFLOW_MOCK: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e contracts uvicorn pytest
      - run: pip install -r services/${{ matrix.service }}/requirements.in
      - if: matrix.service == 'profile_clean'
        run: pip install -r services/profile_clean/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/${{ matrix.service }}

  smoke:
    runs-on: ubuntu-latest
    needs: [contracts-and-registry, service-tests]
    env: {FAKE_LLM: "1", BIFLOW_MOCK: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e contracts uvicorn pytest httpx pyyaml
      # the smoke test starts every module in this interpreter: modules import their real libraries
      # (duckdb, pandas, langgraph...) even in mock mode, so install each module's dependencies
      - run: for s in ingest_quality profile_clean etl semantic_kpi analyst auditor gateway; do pip install -r services/$s/requirements.in; done
      - run: python -m pytest tests/smoke -q
