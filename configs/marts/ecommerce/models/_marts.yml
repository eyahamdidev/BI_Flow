version: 2

# Mart tests are GUARANTEES (severity error): if one fails, the ETL returns status "partial" with the failure listed.
# Staging tests (generated) only OBSERVE the raw data (severity warn).

models:
  - name: fact_orders
    description: One row per order. Read by every KPI (BO5). Columns are a contract (`marts.fact_orders` in the dataset YAML).
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_id}
      - name: order_date
        tests:
          - relationships: {to: ref('dim_date'), field: date_day}
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
              config: {severity: warn}
      - name: review_score
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}

  - name: fact_order_items
    description: One row per order item.
    tests:
      - unique: {column_name: "order_id || '-' || order_item_id"}
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships: {to: ref('fact_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('dim_product'), field: product_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('dim_seller'), field: seller_id}

  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_category
        tests: [not_null]
  - name: dim_seller
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: int_order_payments
    columns:
      - name: order_id
        tests: [unique]
  - name: int_order_reviews
    columns:
      - name: order_id
        tests: [unique]
  - name: int_order_items
    columns:
      - name: order_id
        tests: [unique]
