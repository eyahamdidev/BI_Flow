version: 2

models:
  - name: fact_rentals
    description: One row per day of bike rentals.
    columns:
      - name: day_id
        tests: [unique, not_null]
      - name: rental_date
        tests: [unique, not_null]
      - name: season
        tests:
          - accepted_values: {values: [winter, spring, summer, fall]}
      - name: weather
        tests:
          - accepted_values: {values: [clear, mist/cloudy, light rain/snow, heavy rain/snow]}
      - name: rentals
        tests: [not_null]
