# Recommendation rule table (BO6). The LLM may only REWRITE a matched template into plain language; it cannot add actions.
- id: late_rate_up_region
  when: {kpi: late_rate, trend: up, top_driver_dimension: customer_state}
  action: "Review carrier performance and shipping promises for {top_drivers}."
- id: review_drop_after_delay
  when: {kpi: avg_review_score, trend: down, correlated_with: delivery_delay}
  action: "Prioritise on-time delivery in {top_drivers}: review scores fall where deliveries are late."
- id: revenue_anomaly_low
  when: {kpi: revenue, anomaly: low}
  action: "Check stock-outs, campaign changes and data completeness for {period} before acting on the drop."
- id: aov_up_mix
  when: {kpi: aov, trend: up, top_driver_dimension: product_category}
  action: "Consider promoting the higher-value categories driving the increase: {top_drivers}."
# Added after the first full-Olist run (patterns the data actually shows; each still fires only on computed facts).
- id: reviews_follow_late_deliveries
  when: {kpi: low_review_rate, correlated_with: late_rate}
  action: "Bad reviews move with late deliveries (monthly correlation {correlation}): cutting late deliveries in {top_drivers} is the most direct lever on satisfaction."
- id: late_rate_rose_latest_month
  when: {kpi: late_rate, latest_change: up, top_driver_dimension: customer_state}
  action: "Late deliveries rose in {period}: review carrier performance and delivery promises for {top_drivers}."
- id: revenue_seasonal_peak
  when: {kpi: revenue, anomaly: high}
  action: "Revenue peaked well above trend in {period} (a seasonal event such as Black Friday): plan stock, sellers and carrier capacity for the same period next year."
