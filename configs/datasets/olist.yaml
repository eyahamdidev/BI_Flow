# Dataset config: the ONE place that is Olist-specific. Agents contain no Olist code (BO5 scalability rule).
name: olist
domain: ecommerce
kpi_file: configs/kpis/ecommerce.yaml
recommendations_file: configs/recommendations/ecommerce.yaml

source:                      # BO4 connectors: csv | sql | api
  type: csv
  path: data/raw/olist
  tables:
    orders: olist_orders_dataset.csv
    order_items: olist_order_items_dataset.csv
    order_payments: olist_order_payments_dataset.csv
    order_reviews: olist_order_reviews_dataset.csv
    customers: olist_customers_dataset.csv
    products: olist_products_dataset.csv
    sellers: olist_sellers_dataset.csv
    geolocation: olist_geolocation_dataset.csv
    category_translation: product_category_name_translation.csv

expected_schema:             # BO4 -> pandera. Add the rest of the columns as you go.
  orders:
    order_id: str
    customer_id: str
    order_status: str
    order_purchase_timestamp: datetime
    order_delivered_customer_date: {type: datetime, nullable: true}
    order_estimated_delivery_date: datetime
  order_items:
    order_id: str
    order_item_id: int
    product_id: str
    seller_id: str
    price: float
    freight_value: float
  order_payments:
    order_id: str
    payment_type: str
    payment_installments: int
    payment_value: float
  order_reviews:
    review_id: str
    order_id: str
    review_score: int
  customers:
    customer_id: str
    customer_unique_id: str
    customer_zip_code_prefix: str     # leading zeros ("01037"): must never be read as a number
    customer_state: str
  products:
    product_id: str
    product_category_name: {type: str, nullable: true}
  sellers:
    seller_id: str
    seller_zip_code_prefix: str       # leading zeros
    seller_state: str
  geolocation:
    geolocation_zip_code_prefix: str
    geolocation_lat: float
    geolocation_lng: float
  category_translation:
    product_category_name: str
    product_category_name_english: str

relationships:               # BO1 renders staging/join SQL from this block; BO4 uses it for FK checks
  - {from: order_items.order_id,   to: orders.order_id}
  - {from: order_items.product_id, to: products.product_id}
  - {from: order_items.seller_id,  to: sellers.seller_id}
  - {from: order_payments.order_id, to: orders.order_id}
  - {from: order_reviews.order_id,  to: orders.order_id}
  - {from: orders.customer_id,      to: customers.customer_id}
  - {from: products.product_category_name, to: category_translation.product_category_name}

sample:                      # BO1: scripts/make_sample.py (small FK-consistent copy for tests and fast dev runs)
  root: {table: orders, key: order_id}         # sample the root, then follow `relationships` + `extra_links`
  cover: [order_status]                        # every value of these root columns appears at least `min_per_value` times
  min_per_value: 2
  keep_full: [category_translation]            # small lookup tables copied whole
  max_rows_per_key: {geolocation: 3}           # geolocation has up to ~1000 rows per zip prefix: keep 3 (still has duplicates)
  extra_links:                                 # soft links that are not true FKs (zip prefix is not unique in geolocation)
    - {from: customers.customer_zip_code_prefix, to: geolocation.geolocation_zip_code_prefix}
    - {from: sellers.seller_zip_code_prefix,     to: geolocation.geolocation_zip_code_prefix}

cleaning_rules:              # BO3: rule layer. strategies: drop | constant | median | mode | flag_only | knn_impute
  primary_keys:
    orders: order_id
    products: product_id
    order_reviews: review_id
  rename_columns:
    products:
      product_name_lenght: product_name_length
      product_description_lenght: product_description_length
  parse_dates: [order_purchase_timestamp, order_approved_at, order_delivered_carrier_date, order_delivered_customer_date, order_estimated_delivery_date]
  trim_strings:
    customers: [customer_city]
    sellers: [seller_city]
    geolocation: [geolocation_city, geolocation_state]
  drop_exact_duplicates: [geolocation, order_reviews]
  dedupe:
    geolocation:
      key: geolocation_zip_code_prefix
      normalize_city: [geolocation_city]
      agg: {geolocation_lat: mean, geolocation_lng: mean, geolocation_city: first, geolocation_state: first}
  category_mapping_fixes:
    pc_gamer: pc_gamer
    portateis_cozinha_e_preparadores_de_alimentos: portateis_cozinha_e_preparadores_de_alimentos
    portal_minicursos: portal_minicursos
  null_strategy:
    orders.order_delivered_customer_date: {strategy: flag_only, flag_column: delivery_missing_flag}
    order_reviews.review_comment_message: {strategy: flag_only, flag_column: has_comment}
    products.product_weight_g: {strategy: knn_impute, allowed: [median, knn_impute], imputed_flag: product_weight_g__imputed}
    products.product_length_cm: {strategy: median, allowed: [median, knn_impute], imputed_flag: product_length_cm__imputed}
    products.product_category_name: {strategy: constant, value: unknown}
  impossible_values:
    - {table: order_items, column: price, rule: ">= 0", action: flag, flag_column: price__invalid}
    - {table: order_items, column: freight_value, rule: ">= 0", action: flag, flag_column: freight_value__invalid}
    - {table: orders, rule: "order_delivered_customer_date >= order_purchase_timestamp", action: flag}
  outliers: {method: iqr, columns: [order_items.price, order_items.freight_value, products.product_weight_g], action: flag}
  llm_advisory:
    enabled: true
    prompt_id: profile_clean.suggest_advisory@v2
    allowed_actions: [impute_median, impute_mode, flag, ignore]

quality_score:               # BO4: weights sum to 1
  weights: {completeness: 0.30, uniqueness: 0.20, validity: 0.20, consistency: 0.20, timeliness: 0.10}

etl:                         # BO1: how the ETL module models this dataset
  marts_dir: configs/marts/ecommerce            # domain marts (SQL + tests), shared by every e-commerce dataset
  reconcile: {table: orders, key: order_id, fact: fact_orders}   # one fact row per distinct order
  keys:                                         # grain of each table -> staging uniqueness tests (warn level)
    orders: [order_id]
    order_items: [order_id, order_item_id]
    order_payments: [order_id, payment_sequential]
    order_reviews: [review_id]                  # NOT unique in raw Olist: the warning is expected and documented
    customers: [customer_id]
    products: [product_id]
    sellers: [seller_id]
    geolocation: [geolocation_zip_code_prefix]
    category_translation: [product_category_name]
  cast:                                         # staging casts beyond expected_schema (columns the cleaner leaves as text)
    order_items.shipping_limit_date: datetime
    order_reviews.review_creation_date: datetime
    order_reviews.review_answer_timestamp: datetime
    orders.order_approved_at: datetime
    orders.order_delivered_carrier_date: datetime

marts:                       # BO1 <-> BO5 contract: columns every KPI SQL may rely on
  fact_orders: [order_id, customer_unique_id, order_status, order_purchase_timestamp, payment_value, items_value, freight_value,
                delivery_days, delay_days, is_late, review_score, main_payment_type, payment_installments, customer_state, product_category]
