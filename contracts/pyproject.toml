[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biflow-contracts"
version = "0.1.0"
description = "BIFlow frozen contracts: pydantic models, service kit, LLM helper, contract-test helpers"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "httpx>=0.27", "pyyaml>=6.0", "jsonschema>=4.20"]

[tool.setuptools]
packages = ["biflow_contracts"]
